[project]
name = "heatwave-datawarehouse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SohaKhare", email = "sohaajaykhare2006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]

[project.scripts]
heatwave-datawarehouse = "heatwave_datawarehouse:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
